global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: job-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["job-service:8081"] }]
  - job_name: worker-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["worker-service:8082"] }]
  - job_name: scheduler-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["scheduler-service:8083"] }]
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["api-gateway:8080"] }]
