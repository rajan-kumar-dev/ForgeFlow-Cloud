server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: forgeflow-public-api
          uri: ${JOB_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/**
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
