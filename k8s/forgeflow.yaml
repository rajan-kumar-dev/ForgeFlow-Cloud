apiVersion: v1
kind: Namespace
metadata:
  name: forgeflow
---
apiVersion: v1
kind: Secret
metadata:
  name: forgeflow-secrets
  namespace: forgeflow
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME_BEFORE_DEPLOYMENT"
  RABBITMQ_PASSWORD: "CHANGE_ME_BEFORE_DEPLOYMENT"
  FORGEFLOW_INTERNAL_TOKEN: "CHANGE_ME_TO_A_LONG_RANDOM_TOKEN"
  GRAFANA_PASSWORD: "CHANGE_ME_BEFORE_DEPLOYMENT"
  CLERK_ISSUER_URI: "https://YOUR_CLERK_INSTANCE.clerk.accounts.dev"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgeflow-config
  namespace: forgeflow
data:
  POSTGRES_DB: "forgeflow"
  POSTGRES_USER: "forgeflow"
  RABBITMQ_USER: "forgeflow"
  FORGEFLOW_SECURITY_ENABLED: "true"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/forgeflow"
  SPRING_DATASOURCE_USERNAME: "forgeflow"
  SPRING_RABBITMQ_HOST: "rabbitmq"
  SPRING_RABBITMQ_PORT: "5672"
  SPRING_RABBITMQ_USERNAME: "forgeflow"
  SERVER_PORT_JOB: "8081"
  SERVER_PORT_WORKER: "8082"
  SERVER_PORT_SCHEDULER: "8083"
  JOB_SERVICE_URL: "http://job-service:8081"
  FORGEFLOW_REPORTS_DIR: "/data/reports"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: forgeflow
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: reports-data
  namespace: forgeflow
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: forgeflow
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: forgeflow-config, key: POSTGRES_DB } }
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: forgeflow-config, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: forgeflow-secrets, key: POSTGRES_PASSWORD } }
          volumeMounts: [{ name: postgres-data, mountPath: /var/lib/postgresql/data }]
          readinessProbe: { exec: { command: ["sh", "-c", "pg_isready -U forgeflow -d forgeflow"] }, initialDelaySeconds: 10, periodSeconds: 5 }
          livenessProbe: { exec: { command: ["sh", "-c", "pg_isready -U forgeflow -d forgeflow"] }, initialDelaySeconds: 30, periodSeconds: 10 }
      volumes: [{ name: postgres-data, persistentVolumeClaim: { claimName: postgres-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: forgeflow }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: rabbitmq, namespace: forgeflow }
spec:
  replicas: 1
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq } }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management-alpine
          ports: [{ containerPort: 5672 }, { containerPort: 15672 }]
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: { configMapKeyRef: { name: forgeflow-config, key: RABBITMQ_USER } }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: forgeflow-secrets, key: RABBITMQ_PASSWORD } }
          readinessProbe: { exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }, initialDelaySeconds: 15, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq, namespace: forgeflow }
spec:
  selector: { app: rabbitmq }
  ports: [{ name: amqp, port: 5672, targetPort: 5672 }, { name: management, port: 15672, targetPort: 15672 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: job-service, namespace: forgeflow }
spec:
  replicas: 1
  selector: { matchLabels: { app: job-service } }
  template:
    metadata: { labels: { app: job-service } }
    spec:
      securityContext: { fsGroup: 10001 }
      containers:
        - name: job-service
          image: ghcr.io/YOUR_ORG/forgeflow-job-service:latest
          imagePullPolicy: IfNotPresent
          envFrom: [{ configMapRef: { name: forgeflow-config } }]
          env:
            - { name: SERVER_PORT, value: "8081" }
            - { name: SPRING_DATASOURCE_PASSWORD, valueFrom: { secretKeyRef: { name: forgeflow-secrets, key: POSTGRES_PASSWORD } } }
            - { name: SPRING_RABBITMQ_PASSWORD, valueFrom: { secretKeyRef: { name: forgeflow-secrets, key: RABBITMQ_PASSWORD } } }
            - { name: FORGEFLOW_INTERNAL_TOKEN, valueFrom: { secretKeyRef: { name: forgeflow-secrets, key: FORGEFLOW_INTERNAL_TOKEN } } }
            - { name: FORGEFLOW_SECURITY_ENABLED, value: "true" }
            - { name: CLERK_ISSUER_URI, valueFrom: { secretKeyRef: { name: forgeflow-secrets, key: CLERK_ISSUER_URI } } }
          ports: [{ containerPort: 8081 }]
          volumeMounts: [{ name: reports-data, mountPath: /data/reports }]
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8081 }, initialDelaySeconds: 20, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 8081 }, initialDelaySeconds: 35, periodSeconds: 15 }
      volumes: [{ name: reports-data, persistentVolumeClaim: { claimName: reports-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: job-service, namespace: forgeflow }
spec:
  selector: { app: job-service }
  ports: [{ port: 8081, targetPort: 8081 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: worker-service, namespace: forgeflow }
spec:
  replicas: 2
  selector: { matchLabels: { app: worker-service } }
  template:
    metadata: { labels: { app: worker-service } }
    spec:
      securityContext: { fsGroup: 10001 }
      containers:
        - name: worker-service
          image: ghcr.io/YOUR_ORG/forgeflow-worker-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8082 }]
          envFrom: [{ configMapRef: { name: forgeflow-config } }]
          env:
            - { name: SERVER_PORT, value: "8082" }
            - { name: SPRING_RABBITMQ_PASSWORD, valueFrom: { secretKeyRef: { name: forgeflow-secrets, key: RABBITMQ_PASSWORD } } }
            - { name: FORGEFLOW_INTERNAL_TOKEN, valueFrom: { secretKeyRef: { name: forgeflow-secrets, key: FORGEFLOW_INTERNAL_TOKEN } } }
            - { name: WORKER_CONCURRENCY, value: "2" }
          volumeMounts: [{ name: reports-data, mountPath: /data/reports }]
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8082 }, initialDelaySeconds: 15, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 8082 }, initialDelaySeconds: 30, periodSeconds: 15 }
      volumes: [{ name: reports-data, persistentVolumeClaim: { claimName: reports-data } }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: scheduler-service, namespace: forgeflow }
spec:
  replicas: 1
  selector: { matchLabels: { app: scheduler-service } }
  template:
    metadata: { labels: { app: scheduler-service } }
    spec:
      containers:
        - name: scheduler-service
          image: ghcr.io/YOUR_ORG/forgeflow-scheduler-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8083 }]
          envFrom: [{ configMapRef: { name: forgeflow-config } }]
          env:
            - { name: SERVER_PORT, value: "8083" }
            - { name: FORGEFLOW_INTERNAL_TOKEN, valueFrom: { secretKeyRef: { name: forgeflow-secrets, key: FORGEFLOW_INTERNAL_TOKEN } } }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8083 }, initialDelaySeconds: 10, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: worker-service, namespace: forgeflow }
spec:
  selector: { app: worker-service }
  ports: [{ port: 8082, targetPort: 8082 }]
---
apiVersion: v1
kind: Service
metadata: { name: scheduler-service, namespace: forgeflow }
spec:
  selector: { app: scheduler-service }
  ports: [{ port: 8083, targetPort: 8083 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api-gateway, namespace: forgeflow }
spec:
  replicas: 1
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/YOUR_ORG/forgeflow-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: forgeflow-config } }]
          env: [{ name: SERVER_PORT, value: "8080" }]
          readinessProbe: { httpGet: { path: /actuator/health, port: 8080 }, initialDelaySeconds: 10, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: api-gateway, namespace: forgeflow }
spec:
  selector: { app: api-gateway }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: forgeflow }
spec:
  replicas: 1
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: ghcr.io/YOUR_ORG/forgeflow-frontend:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
          readinessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 5, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: forgeflow }
spec:
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: worker-service, namespace: forgeflow }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: worker-service }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
