apiVersion: v1
kind: ConfigMap
metadata:
  name: forgeflow-prometheus-config
  namespace: forgeflow
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: job-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['job-service:8081']
      - job_name: worker-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['worker-service:8082']
      - job_name: scheduler-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['scheduler-service:8083']
      - job_name: api-gateway
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['api-gateway:8080']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: forgeflow
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
          ports: [{ containerPort: 9090 }]
          volumeMounts: [{ name: config, mountPath: /etc/prometheus }]
      volumes: [{ name: config, configMap: { name: forgeflow-prometheus-config } }]
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: forgeflow }
spec:
  selector: { app: prometheus }
  ports: [{ port: 9090, targetPort: 9090 }]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgeflow-grafana-datasource
  namespace: forgeflow
data:
  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: forgeflow-prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: forgeflow
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          ports: [{ containerPort: 3000 }]
          volumeMounts:
            - { name: datasource-config, mountPath: /etc/grafana/provisioning/datasources }
          env:
            - { name: GF_SECURITY_ADMIN_USER, value: "admin" }
            - { name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: forgeflow-secrets, key: GRAFANA_PASSWORD } } }
            - { name: GF_USERS_ALLOW_SIGN_UP, value: "false" }
      volumes:
        - name: datasource-config
          configMap: { name: forgeflow-grafana-datasource }
---
apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: forgeflow }
spec:
  selector: { app: grafana }
  ports: [{ port: 3000, targetPort: 3000 }]
